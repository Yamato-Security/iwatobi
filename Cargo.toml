[package]
name = "iwatobi"
version = "1.0.0"
repository = "https://github.com/Yamato-Security/iwatobi"
authors = ["Yamato Security @SecurityYamato"]
description = "Native Sigma scanner and DFIR timeline generator for Linux logs"
license = "AGPL-3.0-only"
edition = "2024"
rust-version = "1.88"
include = ["src/**/*", "art/**/*", "config/**/*", "LICENSE", "README.md", "CHANGELOG.md"]

# Every dependency has an explicit floor rather than "*": a wildcard accepts any future
# release, including a breaking one, on the next `cargo update` (see Suzaku #131/#189).
[dependencies]
bytesize = "2"
chrono = { version = "0.4", features = ["clock"] }
chrono-tz = "0.10"
clap = { version = "4.5", features = ["derive"] }
comfy-table = "8"
csv = "1"
dialoguer = "0.12"
flate2 = { version = "1", features = ["zlib-rs"], default-features = false }
glob = "0.3"
hostname = "0.4"
indicatif = "0.18"
num-format = "0.4"
quick-xml = "0.38"
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sigma-rust = { git = "https://github.com/Yamato-Security/sigma-rust", tag = "v0.7.2" }
termcolor = "1"
terminal_size = "0.4"
yaml_serde = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "debuginfo"
